<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMM Store Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; }
    h2 { color: #38bdf8; text-align: center; }
    label { font-size: 14px; color: #cbd5e1; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: none; box-sizing: border-box; }
    input, select { background: #334155; color: #fff; }
    button { background: #0284c7; color: #fff; font-weight: bold; margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🚀 SMM Store</h2>
    <label>Select Service</label>
    <select id="service">
      <option value="101">Instagram Followers - ₹50/1k</option>
      <option value="102">Instagram Likes - ₹20/1k</option>
      <option value="103">Telegram Members - ₹40/1k</option>
    </select>

    <label>Link / Username</label>
    <input type="text" id="link" placeholder="https://instagram.com/..." />

    <label>Quantity</label>
    <input type="number" id="quantity" placeholder="1000" />

    <button onclick="placeOrder()">Order Now</button>
  </div>

  <script>
    Telegram.WebApp.ready();
    function placeOrder() {
      const link = document.getElementById('link').value;
      const quantity = document.getElementById('quantity').value;
      if (!link || !quantity) {
        alert('Please fill all details!');
        return;
      }
      alert('Order Placed Successfully!');
      Telegram.WebApp.close();
    }
  </script>
</body>
</html>
